<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registros — Leitura Manual</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply bg-white dark:bg-neutral-900 rounded-lg border border-neutral-200 dark:border-neutral-800 shadow-sm; }
      .label { @apply block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1.5; }
      .input {
        color-scheme: dark;
        @apply w-full h-10 px-3 py-2 text-sm text-neutral-900 dark:text-white bg-white dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-600 rounded-md shadow-sm transition-all placeholder:text-neutral-400 dark:placeholder:text-neutral-400 hover:border-neutral-400 dark:hover:border-neutral-500 focus:outline-none focus:ring-2 focus:ring-neutral-400/40 dark:focus:ring-neutral-400/30 focus:border-neutral-500 dark:focus:border-neutral-400;
      }
      .select {
        color-scheme: dark;
        @apply h-10 px-3 pr-8 text-sm text-neutral-900 dark:text-white bg-white dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-600 rounded-md shadow-sm transition-all hover:border-neutral-400 dark:hover:border-neutral-500 focus:outline-none focus:ring-2 focus:ring-neutral-400/40 dark:focus:ring-neutral-400/30 focus:border-neutral-500 dark:focus:border-neutral-400;
      }
      .btn { @apply inline-flex items-center justify-center gap-1.5 h-9 px-4 text-sm font-medium rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 dark:focus:ring-offset-neutral-950 disabled:opacity-50 disabled:pointer-events-none; }
      .btn-outline { @apply border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100 hover:bg-neutral-50 dark:hover:bg-neutral-800 focus:ring-neutral-900/10 dark:focus:ring-neutral-400/30; }
      .btn-primary { @apply bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 hover:bg-neutral-700 dark:hover:bg-neutral-200 focus:ring-neutral-900/50 dark:focus:ring-neutral-400/50; }
      .badge { @apply inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium; }
      .th { @apply border-b border-neutral-200 dark:border-neutral-800 px-3 py-2.5 text-left text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-400; }
      .td { @apply border-b border-neutral-200 dark:border-neutral-800 px-3 py-2.5 text-sm text-neutral-700 dark:text-neutral-300; }
    }
  </style>
</head>
<body class="min-h-screen bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-50 antialiased">
  <div class="mx-auto max-w-6xl px-4 py-8">
    <div class="mb-6 flex items-center justify-between">
      <h1 class="text-2xl font-semibold tracking-tight">Registros de leitura</h1>
      <div class="flex items-center gap-4 text-sm">
        <a href="/config" class="text-neutral-500 dark:text-neutral-400 underline-offset-4 hover:text-neutral-900 dark:hover:text-neutral-50 hover:underline">Configurar</a>
        <a href="/" class="text-neutral-500 dark:text-neutral-400 underline-offset-4 hover:text-neutral-900 dark:hover:text-neutral-50 hover:underline">← Formulário</a>
      </div>
    </div>

    <div class="card mb-6 p-4">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-5">
        <div>
          <label for="f-livro" class="label">Livro</label>
          <select id="f-livro" class="select w-full"><option value="">Todos</option></select>
        </div>
        <div>
          <label for="f-sync" class="label">KOReader</label>
          <select id="f-sync" class="select w-full">
            <option value="">Todos</option>
            <option value="0">Em espera</option>
            <option value="1">Sincronizado</option>
            <option value="2">Pulada</option>
          </select>
        </div>
        <div>
          <label for="f-inicio" class="label">A partir de</label>
          <input type="date" id="f-inicio" class="input">
        </div>
        <div>
          <label for="f-fim" class="label">Até</label>
          <input type="date" id="f-fim" class="input">
        </div>
        <div class="flex items-end gap-2">
          <button id="btn-filtrar" class="btn btn-primary">Filtrar</button>
          <button id="btn-exportar" class="btn btn-outline">Exportar CSV</button>
        </div>
      </div>
    </div>

    <div id="stats" class="mb-6 grid grid-cols-2 gap-3 sm:grid-cols-4"></div>

    <div class="mb-6 grid grid-cols-1 gap-4 lg:grid-cols-2">
      <div class="card p-4">
        <h3 class="mb-3 text-sm font-semibold">Por dia</h3>
        <div class="serie-corpo overflow-x-auto"></div>
      </div>
      <div class="card p-4">
        <h3 class="mb-3 text-sm font-semibold">Por mês</h3>
        <div class="serie-corpo overflow-x-auto"></div>
      </div>
    </div>

    <div class="card overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr>
            <th class="th">ID</th>
            <th class="th">Livro</th>
            <th class="th">Início</th>
            <th class="th">Fim</th>
            <th class="th text-right tab-num">P. ini</th>
            <th class="th text-right tab-num">P. fim</th>
            <th class="th text-right tab-num">Tot.</th>
            <th class="th">KOReader</th>
            <th class="th text-right">Ações</th>
          </tr>
        </thead>
        <tbody id="corpo"></tbody>
      </table>
      <div id="vazio" class="hidden px-4 py-10 text-center text-sm font-medium text-neutral-500 dark:text-neutral-400">Nenhum registro encontrado.</div>
    </div>

    <div class="mt-4 flex items-center justify-center gap-3">
      <button id="btn-ant" class="btn btn-outline h-8 px-3">‹ Anterior</button>
      <span id="info-pagina" class="text-sm text-neutral-600 dark:text-neutral-400"></span>
      <button id="btn-prox" class="btn btn-outline h-8 px-3">Próxima ›</button>
    </div>
  </div>

  <dialog id="dialog-editar" class="card w-[92%] max-w-md p-0 backdrop:bg-neutral-900/40 dark:backdrop:bg-black/70">
    <div class="border-b border-neutral-200 dark:border-neutral-800 px-4 py-3">
      <h2 class="text-base font-semibold">Editar registro <span id="edit-id"></span></h2>
    </div>
    <div id="edit-form" class="p-4"></div>
    <div class="flex justify-end gap-2 border-t border-neutral-200 dark:border-neutral-800 px-4 py-3">
      <button id="btn-fechar-editar" class="btn btn-outline">Cancelar</button>
      <button id="btn-salvar-edicao" class="btn btn-primary">Salvar</button>
    </div>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);

    const POR_PAGINA = 10;
    let livros = [];
    let pagina = 1;
    let totalPaginas = 1;
    let editando = null;

    const fmt = (v) => {
      const d = new Date(v);
      if (isNaN(d.getTime())) return v;
      return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    };

    const fmtNum = (v) => {
      const n = Number(v);
      return Number.isInteger(n) ? n.toString() : n.toFixed(1);
    };

    const iso = (v) => {
      const d = new Date(v);
      const pad = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
        "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
    };

    const badgeSync = (s) => {
      if (s === 1) return '<span class="badge bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-400">✓ Sincronizado</span>';
      if (s === 2) return '<span class="badge bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300">Pulada</span>';
      return '<span class="badge bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-400">Em espera</span>';
    };

    const thSerie = (rotulo) =>
      "<th class='border-b border-neutral-200 dark:border-neutral-800 px-3 py-2 text-left text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-400'>" + rotulo + "</th>";

    const tdSerie = (valor) =>
      "<td class='border-b border-neutral-200 dark:border-neutral-800 px-3 py-2 text-sm text-neutral-700 dark:text-neutral-300'>" + valor + "</td>";

    const serieHtml = (colunas, linhas) =>
      "<table class='w-full whitespace-nowrap'><thead><tr>" + colunas.map(thSerie).join("") +
      "</tr></thead><tbody>" + linhas.map((l) => "<tr>" + l.map(tdSerie).join("") + "</tr>").join("") + "</tbody></table>";

    async function init() {
      const res = await fetch("/api/opcoes");
      const data = await res.json();
      livros = data.livros || [];
      const sel = $("f-livro");
      livros.forEach((li) => {
        const opt = document.createElement("option");
        opt.value = li.md5 || "";
        opt.textContent = li.titulo;
        sel.appendChild(opt);
      });
    }

    function queryFiltros() {
      const params = new URLSearchParams({ limit: String(POR_PAGINA), page: String(pagina) });
      const livro = $("f-livro").value;
      const sync = $("f-sync").value;
      const inicio = $("f-inicio").value;
      const fim = $("f-fim").value;
      if (livro) params.set("md5", livro);
      if (sync !== "") params.set("sincronizada", sync);
      if (inicio) params.set("data_inicio", inicio + "T00:00");
      if (fim) params.set("data_fim", fim + "T23:59");
      return params;
    }

    function renderLinhas(registros) {
      return registros.map((r) =>
        "<tr>" +
        "<td class='td'>" + r.id + "</td>" +
        "<td class='td'>" + (r.titulo || "—") + "</td>" +
        "<td class='td whitespace-nowrap'>" + fmt(r.data_hora_1) + "</td>" +
        "<td class='td whitespace-nowrap'>" + fmt(r.data_hora_2) + "</td>" +
        "<td class='td text-right tab-num'>" + r.numero_1 + "</td>" +
        "<td class='td text-right tab-num'>" + r.numero_2 + "</td>" +
        "<td class='td text-right tab-num'>" + r.numero_3 + "</td>" +
        "<td class='td text-center'>" + badgeSync(r.leitura_sincronizada) + "</td>" +
        "<td class='td text-right whitespace-nowrap'>" +
        "<button class='btn btn-outline h-8 px-2.5 mr-1 acao-editar' data-id='" + r.id + "'>Editar</button>" +
        "<button class='btn btn-outline h-8 px-2.5 acao-excluir' data-id='" + r.id + "'>Excluir</button>" +
        "</td></tr>"
      ).join("");
    }

    function renderStats(s) {
      const porLivro = (s.por_tipo || []).map((t) => t.tipo + ": " + t.n).join(" · ");
      const card = (valor, rotulo) =>
        "<div class='card p-4'><div class='text-2xl font-semibold tracking-tight'>" + valor +
        "</div><div class='mt-1 text-xs text-neutral-500 dark:text-neutral-400'>" + rotulo + "</div></div>";

      $("stats").innerHTML =
        card(s.total, "Total") +
        card(fmtNum(s.duracao_media_horas) + " h", "Duração média") +
        card(fmtNum(s.media_num1), "Média pág. inicial") +
        card(fmtNum(s.media_num2), "Média pág. final") +
        card(fmtNum(s.media_num3), "Média total págs.") +
        card(s.primeira_data || "—", "Primeira") +
        card(s.ultima_data || "—", "Última") +
        card((porLivro || "—"), "Por livro");

      const corpos = document.querySelectorAll(".serie-corpo");
      corpos.forEach((el) => { el.innerHTML = ""; });
      const corpoDia = corpos[0];
      const corpoMes = corpos[1];
      if (corpoDia) corpoDia.innerHTML = serieHtml(["Dia", "Qtd", "Horas"], (s.por_dia || []).map((d) => [d.dia, d.n, fmtNum(d.horas)]));
      if (corpoMes) corpoMes.innerHTML = serieHtml(["Mês", "Qtd", "Horas"], (s.por_mes || []).map((m) => [m.mes, m.n, fmtNum(m.horas)]));
    }

    async function carregar() {
      const params = queryFiltros();
      const res = await fetch("/api/leitura?" + params.toString());
      const data = await res.json();

      $("corpo").innerHTML = renderLinhas(data.registros || []);
      $("vazio").classList.toggle("hidden", data.total !== 0);

      totalPaginas = Math.max(1, Math.ceil(data.total / POR_PAGINA));
      $("info-pagina").textContent = "Página " + data.page + " de " + totalPaginas + " (" + data.total + " registros)";
      $("btn-ant").disabled = data.page <= 1;
      $("btn-prox").disabled = data.page >= totalPaginas;

      const resStats = await fetch("/api/stats");
      renderStats(await resStats.json());
    }

    function aplicarFiltros() {
      pagina = 1;
      carregar();
    }

    function irPagina(delta) {
      pagina = Math.max(1, Math.min(totalPaginas, pagina + delta));
      carregar();
    }

    function exportarCsv() {
      const params = queryFiltros();
      params.delete("limit");
      params.delete("page");
      window.location.href = "/api/export.csv?" + params.toString();
    }

    function editar(id) {
      const r = editando;
      if (!r) return;

      $("edit-id").textContent = r.id;

      const livroOptions = livros.map((li) =>
        '<option value="' + (li.md5 || "") + '"' + (li.md5 === r.md5 ? " selected" : "") + ">" +
        li.titulo + "</option>"
      ).join("");

      const campo = (labelTexto, conteudo) =>
        '<label class="label mt-3">' + labelTexto + "</label>" + conteudo;

      $("edit-form").innerHTML =
        campo("Livro", '<select id="edit-md5" class="select w-full">' + livroOptions + "</select>") +
        campo("Início da leitura", '<input type="datetime-local" id="edit-dt1" value="' + iso(r.data_hora_1) + '" class="input">') +
        campo("Término da leitura", '<input type="datetime-local" id="edit-dt2" value="' + iso(r.data_hora_2) + '" class="input">') +
        campo("Página inicial da leitura", '<input type="number" id="edit-num-1" min="1" value="' + (r.numero_1 ?? 1) + '" class="input">') +
        campo("Página final da leitura", '<input type="number" id="edit-num-2" min="1" value="' + (r.numero_2 ?? 1) + '" class="input">') +
        campo("Total de páginas do livro físico", '<input type="number" id="edit-num-3" min="1" value="' + (r.numero_3 ?? 1) + '" class="input">');

      $("dialog-editar").showModal();
    }

    async function buscarRegistro(id) {
      const res = await fetch("/api/leitura?limit=1000");
      const data = await res.json();
      return (data.registros || []).find((x) => x.id === id);
    }

    document.addEventListener("click", (e) => {
      const btnEditar = e.target.closest(".acao-editar");
      if (btnEditar) {
        buscarRegistro(Number(btnEditar.dataset.id)).then((r) => {
          if (!r) return;
          editando = r;
          editar(r.id);
        });
        return;
      }
      const btnExcluir = e.target.closest(".acao-excluir");
      if (btnExcluir) {
        excluir(Number(btnExcluir.dataset.id));
      }
    });

    function fecharEditar() {
      $("dialog-editar").close();
      editando = null;
    }

    async function salvarEdicao() {
      if (!editando) return;
      const md5 = $("edit-md5").value;
      const livroObj = livros.find((li) => li.md5 === md5);
      const dados = {
        md5: md5,
        titulo: livroObj ? livroObj.titulo : undefined,
        data_hora_1: $("edit-dt1").value,
        data_hora_2: $("edit-dt2").value,
        numero_1: parseInt($("edit-num-1").value, 10),
        numero_2: parseInt($("edit-num-2").value, 10),
        numero_3: parseInt($("edit-num-3").value, 10),
      };

      const res = await fetch("/api/leitura?id=" + editando.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados),
      });
      const result = await res.json();
      const salvou = result.ok;
      fecharEditar();
      if (salvou) {
        carregar();
      } else {
        alert("Erro: " + result.error);
      }
    }

    async function excluir(id) {
      if (!confirm("Excluir registro " + id + "?")) return;
      const res = await fetch("/api/leitura?id=" + id, { method: "DELETE" });
      const data = await res.json();
      if (data.ok) {
        carregar();
      } else {
        alert("Erro: " + data.error);
      }
    }

    $("btn-filtrar").addEventListener("click", aplicarFiltros);
    $("btn-exportar").addEventListener("click", exportarCsv);
    $("btn-ant").addEventListener("click", () => irPagina(-1));
    $("btn-prox").addEventListener("click", () => irPagina(1));
    $("btn-fechar-editar").addEventListener("click", fecharEditar);
    $("btn-salvar-edicao").addEventListener("click", salvarEdicao);
    $("dialog-editar").addEventListener("click", (e) => { if (e.target === $("dialog-editar")) fecharEditar(); });

    ["f-inicio", "f-fim"].forEach((id) => {
      $(id).addEventListener("change", aplicarFiltros);
    });

    $("f-livro").addEventListener("change", aplicarFiltros);
    $("f-sync").addEventListener("change", aplicarFiltros);

    init().then(carregar);
  </script>
</body>
</html>
