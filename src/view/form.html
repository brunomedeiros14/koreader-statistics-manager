<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitura Manual</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="max-w-lg mx-auto px-4 py-6 font-sans text-neutral-900 bg-white">
  <div class="flex justify-between items-center mb-1">
    <h1 class="text-2xl font-bold">Leitura Manual</h1>
    <a href="/registros" class="text-base text-neutral-900 underline decoration-neutral-900">Ver registros →</a>
  </div>

  <section id="secao-livro" class="mb-5">
    <h2 class="text-lg font-semibold mb-2">Livro</h2>
    <div class="border-2 border-neutral-900 rounded" id="lista"></div>
  </section>

  <section class="mb-5">
    <div class="mb-3">
      <label for="dt1" class="block mb-1 font-semibold">Início da leitura</label>
      <input type="datetime-local" id="dt1" class="w-full px-2 py-2 border-2 border-neutral-900 text-base bg-white">
      <div class="erro text-sm font-semibold text-red-700 mt-0.5 min-h-[1.2em]" id="erro-dt1"></div>
    </div>
    <div class="mb-3">
      <label for="dt2" class="block mb-1 font-semibold">Término da leitura</label>
      <input type="datetime-local" id="dt2" class="w-full px-2 py-2 border-2 border-neutral-900 text-base bg-white">
      <div class="erro text-sm font-semibold text-red-700 mt-0.5 min-h-[1.2em]" id="erro-dt2"></div>
    </div>
  </section>

  <section class="mb-5">
    <div class="mb-3">
      <label for="num-1" class="block mb-1 font-semibold">Página inicial da leitura</label>
      <input type="number" id="num-1" min="1" value="1" class="w-full px-2 py-2 border-2 border-neutral-900 text-base bg-white">
      <div class="erro text-sm font-semibold text-red-700 mt-0.5 min-h-[1.2em]" id="erro-num-1"></div>
    </div>
    <div class="mb-3">
      <label for="num-2" class="block mb-1 font-semibold">Página final da leitura</label>
      <input type="number" id="num-2" min="1" value="1" class="w-full px-2 py-2 border-2 border-neutral-900 text-base bg-white">
      <div class="erro text-sm font-semibold text-red-700 mt-0.5 min-h-[1.2em]" id="erro-num-2"></div>
    </div>
    <div class="mb-3">
      <label for="num-3" class="block mb-1 font-semibold">Total de páginas do livro físico</label>
      <input type="number" id="num-3" min="1" value="1" class="w-full px-2 py-2 border-2 border-neutral-900 text-base bg-white">
      <div class="erro text-sm font-semibold text-red-700 mt-0.5 min-h-[1.2em]" id="erro-num-3"></div>
    </div>
  </section>

  <button class="btn-salvar block w-full mt-5 px-3 py-3 bg-neutral-900 text-white text-lg font-bold border-2 border-neutral-900 rounded hover:bg-neutral-800" onclick="abrirDialog()">Salvar</button>

  <dialog id="dialog" class="border-[3px] border-neutral-900 p-5 max-w-md w-[90%] rounded bg-white text-neutral-900">
    <h2 class="text-lg font-semibold mb-3">Confirmar leitura</h2>
    <div class="resumo mb-4 leading-relaxed" id="resumo"></div>
    <div class="dialog-botoes flex gap-2 justify-end">
      <button class="btn-cancelar px-4 py-2 border-2 border-neutral-900 bg-white rounded hover:bg-neutral-100" onclick="fecharDialog()">Cancelar</button>
      <button class="btn-confirmar px-4 py-2 border-2 border-neutral-900 bg-neutral-900 text-white font-bold rounded hover:bg-neutral-800" onclick="confirmar()">Confirmar</button>
    </div>
  </dialog>

  <script>
    document.querySelector("dialog").addEventListener("click", function (e) {
      if (e.target === this) this.close();
    });

    let livros = [];
    let paginaAtual = 1;
    const POR_PAGINA = 5;
    let livroSelecionado = null;

    function uid() {
      try {
        return crypto.randomUUID();
      } catch (e) {
        return 'web-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      }
    }

    async function init() {
      const res = await fetch("/api/opcoes");
      const data = await res.json();
      livros = data.livros || [];
      renderLista();
      if (livros.length === 0) {
        document.getElementById("secao-livro").style.display = "none";
      }
    }

    function renderLista() {
      const el = document.getElementById("lista");
      const total = livros.length;
      const totalPaginas = Math.max(1, Math.ceil(total / POR_PAGINA));
      paginaAtual = Math.min(paginaAtual, totalPaginas);
      const inicio = (paginaAtual - 1) * POR_PAGINA;
      const fim = Math.min(inicio + POR_PAGINA, total);

      let html = "";
      for (let i = inicio; i < fim; i++) {
        const li = livros[i];
        const sel = livroSelecionado === li.id;
        html += '<button class="lista-item block w-full px-3 py-2.5 text-left text-neutral-900 bg-white border-b border-neutral-900 last:border-b-0' + (sel ? " bg-neutral-900 text-white" : " hover:bg-neutral-100") + ' rounded"'
          + ' onclick="selecionar(' + li.id + ')">'
          + (sel ? "✓" : "◦") + " " + li.titulo
          + "</button>";
      }

      html += '<div class="lista-navegacao flex justify-between items-center px-3 py-2 border-t-2 border-neutral-900 text-sm">'
        + '<button onclick="anterior()" ' + (paginaAtual <= 1 ? "disabled" : "") + ' class="px-3 py-1 border border-neutral-900 bg-white rounded hover:bg-neutral-100 disabled:opacity-30 disabled:hover:bg-white">‹ Anterior</button>'
        + "<span>Página " + paginaAtual + " de " + totalPaginas + "</span>"
        + '<button onclick="proxima()" ' + (paginaAtual >= totalPaginas ? "disabled" : "") + ' class="px-3 py-1 border border-neutral-900 bg-white rounded hover:bg-neutral-100 disabled:opacity-30 disabled:hover:bg-white">Próxima ›</button>'
        + "</div>";

      el.innerHTML = html;
    }

    function selecionar(id) {
      livroSelecionado = id;
      renderLista();
    }

    function anterior() {
      if (paginaAtual > 1) { paginaAtual--; renderLista(); }
    }

    function proxima() {
      const totalPaginas = Math.max(1, Math.ceil(livros.length / POR_PAGINA));
      if (paginaAtual < totalPaginas) { paginaAtual++; renderLista(); }
    }

    function limparErros() {
      document.querySelectorAll(".erro").forEach(function(e) { e.textContent = ""; });
    }

    function abrirDialog() {
      limparErros();
      var ok = true;

      if (livros.length > 0 && !livroSelecionado) {
        ok = false;
      }

      var dt1 = document.getElementById("dt1").value;
      var dt2 = document.getElementById("dt2").value;
      if (!dt1) { document.getElementById("erro-dt1").textContent = "Obrigatório"; ok = false; }
      if (!dt2) { document.getElementById("erro-dt2").textContent = "Obrigatório"; ok = false; }
      if (dt1 && dt2 && dt2 <= dt1) {
        document.getElementById("erro-dt2").textContent = "Deve ser posterior ao início";
        ok = false;
      }

      var n1 = parseInt(document.getElementById("num-1").value, 10);
      var n2 = parseInt(document.getElementById("num-2").value, 10);
      var n3 = parseInt(document.getElementById("num-3").value, 10);
      if (isNaN(n1) || n1 < 1) { document.getElementById("erro-num-1").textContent = "Deve ser inteiro >= 1"; ok = false; }
      if (isNaN(n2) || n2 < 1) { document.getElementById("erro-num-2").textContent = "Deve ser inteiro >= 1"; ok = false; }
      if (isNaN(n3) || n3 < 1) { document.getElementById("erro-num-3").textContent = "Deve ser inteiro >= 1"; ok = false; }
      if (!ok) return;
      if (n2 < n1) {
        document.getElementById("erro-num-2").textContent = "Deve ser maior ou igual à página inicial";
        ok = false;
      }
      if (!ok) return;

      var livroObj = livros.find(function(o) { return o.id === livroSelecionado; });
      var livroTexto = livroObj ? livroObj.titulo : "—";
      var fmt = function(v) {
        var d = new Date(v);
        return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
      };
      var linhas = "<strong>Livro:</strong> " + livroTexto + "<br>"
        + "<strong>Início:</strong> " + fmt(dt1) + "<br>"
        + "<strong>Fim:</strong> " + fmt(dt2) + "<br>"
        + "<strong>Página inicial:</strong> " + n1 + "<br>"
        + "<strong>Página final:</strong> " + n2 + "<br>"
        + "<strong>Total de páginas:</strong> " + n3;
      document.getElementById("resumo").innerHTML = linhas;
      document.getElementById("dialog").showModal();
    }

    function fecharDialog() {
      document.getElementById("dialog").close();
    }

    async function confirmar() {
      var livroObj = livros.find(function(o) { return o.id === livroSelecionado; });
      var dados = {
        op_id: uid(),
        md5: livroObj ? livroObj.md5 : undefined,
        titulo: livroObj ? livroObj.titulo : undefined,
        origem: "web",
        data_hora_1: document.getElementById("dt1").value,
        data_hora_2: document.getElementById("dt2").value,
        numero_1: parseInt(document.getElementById("num-1").value, 10),
        numero_2: parseInt(document.getElementById("num-2").value, 10),
        numero_3: parseInt(document.getElementById("num-3").value, 10),
      };

      try {
        var res = await fetch("/api/leitura", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dados),
        });
        var result = await res.json();
        fecharDialog();
        if (result.ok) {
          document.body.innerHTML = '<div class="sucesso text-center py-10 text-lg font-bold">'
            + "✓ Leitura registrada com sucesso!<br><br>"
            + '<a href="/" class="text-neutral-900 underline decoration-neutral-900">Voltar</a>'
            + "</div>";
        } else {
          alert("Erro: " + result.error);
        }
      } catch (err) {
        fecharDialog();
        alert("Erro de conexão: " + err);
      }
    }

    init();
  </script>
</body>
</html>
