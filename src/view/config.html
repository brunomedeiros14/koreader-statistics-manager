<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração — Leitura Manual</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply bg-white dark:bg-neutral-900 rounded-lg border border-neutral-200 dark:border-neutral-800 shadow-sm; }
      .label { @apply block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1.5; }
      .input {
        color-scheme: dark;
        @apply w-full h-10 px-3 py-2 text-sm text-neutral-900 dark:text-white bg-white dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-600 rounded-md shadow-sm transition-all placeholder:text-neutral-400 dark:placeholder:text-neutral-400 hover:border-neutral-400 dark:hover:border-neutral-500 focus:outline-none focus:ring-2 focus:ring-neutral-400/40 dark:focus:ring-neutral-400/30 focus:border-neutral-500 dark:focus:border-neutral-400;
      }
      .btn { @apply inline-flex items-center justify-center gap-1.5 h-9 px-4 text-sm font-medium rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 dark:focus:ring-offset-neutral-950 disabled:opacity-50 disabled:pointer-events-none; }
      .btn-outline { @apply border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100 hover:bg-neutral-50 dark:hover:bg-neutral-800 focus:ring-neutral-900/10 dark:focus:ring-neutral-400/30; }
      .btn-primary { @apply bg-neutral-900 dark:bg-neutral-100 text-white dark:text-neutral-900 hover:bg-neutral-700 dark:hover:bg-neutral-200 focus:ring-neutral-900/50 dark:focus:ring-neutral-400/50; }
      .btn-ghost { @apply text-neutral-500 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:text-neutral-900 dark:hover:text-neutral-100 focus:ring-neutral-900/10 dark:focus:ring-neutral-400/30; }
    }
  </style>
</head>
<body class="min-h-screen bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-50 antialiased">
  <div class="mx-auto max-w-2xl px-4 py-8">
    <div class="mb-6 flex items-center justify-between">
      <h1 class="text-2xl font-semibold tracking-tight">Configuração</h1>
      <a href="/registros" class="text-sm text-neutral-500 dark:text-neutral-400 underline-offset-4 hover:text-neutral-900 dark:hover:text-neutral-50 hover:underline">← Registros</a>
    </div>

    <div class="card mb-6">
      <div class="border-b border-neutral-200 dark:border-neutral-800 px-4 py-3">
        <h2 class="text-base font-semibold">Livros mapeados</h2>
        <p class="mt-0.5 text-sm text-neutral-500 dark:text-neutral-400">
          Título + md5 conhecidos pelo servidor. Livros novos são cadastrados automaticamente na primeira leitura enviada pelo plugin.
        </p>
      </div>
      <div class="p-4">
        <div id="lista-livros"></div>
        <div id="vazio" class="hidden px-4 py-8 text-center text-sm text-neutral-500 dark:text-neutral-400">Nenhum livro cadastrado.</div>
        <button id="btn-add" class="btn btn-outline mt-2">+ Adicionar livro</button>
      </div>
    </div>

    <button id="btn-salvar" class="btn btn-primary h-11 w-full text-base">Salvar configuração</button>
    <p id="mensagem" class="mt-3 min-h-[1.2em] text-center text-sm font-medium text-green-700 dark:text-green-400" aria-live="polite"></p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const LISTA = $("lista-livros");
    let livros = [];

    const esc = (s) =>
      String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

    function render() {
      const total = livros.length;
      $("vazio").classList.toggle("hidden", total !== 0);
      LISTA.classList.toggle("hidden", total === 0);

      LISTA.innerHTML = livros.map((li, i) => {
        const cimaDesabilitado = i === 0;
        const baixoDesabilitado = i === total - 1;
        return '<div class="card mb-3 p-3" data-indice="' + i + '">' +
          '<div class="flex items-center gap-2">' +
          '<div class="flex flex-col gap-0.5">' +
          '<button type="button" class="btn btn-ghost h-6 w-6 px-0 text-xs" data-acao="cima" data-i="' + i + '" ' + (cimaDesabilitado ? "disabled" : "") + ' title="Mover para cima">▲</button>' +
          '<button type="button" class="btn btn-ghost h-6 w-6 px-0 text-xs" data-acao="baixo" data-i="' + i + '" ' + (baixoDesabilitado ? "disabled" : "") + ' title="Mover para baixo">▼</button>' +
          "</div>" +
          '<div class="flex flex-1 flex-col gap-2">' +
          '<input type="text" placeholder="Título" value="' + esc(li.titulo || "") + '" class="input input-titulo" data-i="' + i + '">' +
          '<input type="text" placeholder="md5 (32 hex)" value="' + esc(li.md5 || "") + '" class="input font-mono input-md5" data-i="' + i + '">' +
          "</div>" +
          '<button type="button" class="btn btn-ghost h-9 w-9 px-0 text-base" data-acao="remover" data-i="' + i + '" title="Remover" aria-label="Remover livro">✕</button>' +
          "</div></div>";
      }).join("");
    }

    function mover(i, delta) {
      const j = i + delta;
      if (j < 0 || j >= livros.length) return;
      const temp = livros[i];
      livros[i] = livros[j];
      livros[j] = temp;
      render();
    }

    function remover(i) {
      livros.splice(i, 1);
      render();
    }

    function adicionar() {
      livros.push({ id: null, titulo: "", md5: "" });
      render();
    }

    async function salvar() {
      const validos = livros.filter((li) => {
        const md5 = (li.md5 || "").trim().toLowerCase();
        const titulo = (li.titulo || "").trim();
        return titulo !== "" && /^[0-9a-f]{32}$/.test(md5);
      }).map((li) => ({ titulo: li.titulo.trim(), md5: li.md5.trim().toLowerCase() }));

      const res = await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ livros: validos }),
      });
      const data = await res.json();
      const mensagem = $("mensagem");
      const ok = data.ok;
      mensagem.textContent = ok ? "✓ Configuração salva!" : "Erro: " + (data.error || "desconhecido");
      mensagem.classList.toggle("text-green-700 dark:text-green-400", ok);
      mensagem.classList.toggle("text-red-600 dark:text-red-400", !ok);
      if (ok) {
        livros = data.livros;
        render();
      }
    }

    LISTA.addEventListener("input", (e) => {
      const li = e.target.closest("[data-indice]");
      if (!li) return;
      const idx = Number(li.dataset.indice);
      if (e.target.classList.contains("input-titulo")) livros[idx].titulo = e.target.value;
      if (e.target.classList.contains("input-md5")) livros[idx].md5 = e.target.value;
    });

    LISTA.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-acao]");
      if (!btn) return;
      const i = Number(btn.dataset.i);
      if (btn.dataset.acao === "cima") mover(i, -1);
      else if (btn.dataset.acao === "baixo") mover(i, 1);
      else if (btn.dataset.acao === "remover") remover(i);
    });

    $("btn-add").addEventListener("click", adicionar);
    $("btn-salvar").addEventListener("click", salvar);

    async function carregar() {
      const res = await fetch("/api/opcoes");
      const data = await res.json();
      livros = data.livros || [];
      render();
    }

    carregar();
  </script>
</body>
</html>
